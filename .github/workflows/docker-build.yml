name: Build, Test and Push d3b4 to Docker Hub

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push yet)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: piknar/d3b4:test-candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test - start container
        run: |
          docker run -d \
            --name d3b4-smoke \
            -p 8080:8080 \
            -e PORT=8080 \
            -e A0_CHAT_MODEL_NAME="venice/claude-sonnet-4-6" \
            -e A0_UTIL_MODEL_NAME="venice/claude-sonnet-4-6" \
            piknar/d3b4:test-candidate
          echo "Container started, waiting 30s for startup..."
          sleep 30

      - name: Smoke test - check container is still running
        run: |
          if ! docker ps | grep d3b4-smoke; then
            echo "❌ Container crashed! Showing logs:"
            docker logs d3b4-smoke
            exit 1
          fi
          echo "✅ Container is running"

      - name: Smoke test - check HTTP response on port 8080
        run: |
          echo "Checking if port 8080 responds..."
          for i in {1..6}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ --max-time 10 || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" != "000" ]; then
              echo "✅ Port 8080 is responding (HTTP $STATUS)"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Port 8080 never responded. Container logs:"
          docker logs d3b4-smoke
          exit 1

      - name: Show container logs (always)
        if: always()
        run: docker logs d3b4-smoke 2>&1 | tail -50

      - name: Stop and remove test container
        if: always()
        run: docker rm -f d3b4-smoke || true

      # Only runs if smoke test passed
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: piknar/d3b4
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Push verified image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
