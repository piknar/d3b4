# fly.toml - d3b4-beefy Fly.io deployment
# Deploy: fly deploy --config fly.toml
app = "d3b4-beefy"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile.beefy"

[env]
  PORT = "8080"
  IS_DOCKERIZED = "true"
  SHELL_INTERFACE = "local"
  A0_SET_SHELL_INTERFACE = "local"
  A0_SET_CODE_EXEC_SSH_ENABLED = "false"
  A0_SET_embed_model_provider = "huggingface"
  A0_SET_embed_model_name = "sentence-transformers/all-MiniLM-L6-v2"
  A0_SET_memory_recall_enabled = "true"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "60s"

  [[services.http_checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "60s"
    method = "get"
    path = "/"

[[mounts]]
  source = "d3b4_beefy_data"
  destination = "/d3b4/usr"

[vm]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
